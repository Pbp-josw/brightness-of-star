<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중3 과학: 실제 별자리 데이터와 등급 변화</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --star-real: #fde047;
      --star-ghost: #94a3b8;
      --text: #f8fafc;
      --text-muted: #cbd5e1;
      --border: #334155;
      --pc10-line: #10b981;
      --real-mode: #f59e0b;
      --virtual-mode: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 5px;
    }

    header h1 {
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      padding: 6px 14px;
      border-radius: 8px;
      display: inline-block;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* 프리셋 탭 & 버튼 */
    .preset-section {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    
    .preset-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset-btn {
      background: #0f172a;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .preset-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .preset-btn.custom-btn {
      background: #334155;
      color: #fff;
    }
    .preset-btn.custom-btn.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
    }

    /* 사용자 설정 패널 (기본 숨김) */
    .custom-panel {
      display: none;
      background: rgba(139, 92, 246, 0.15);
      border-left: 4px solid #8b5cf6;
      padding: 12px 16px;
      border-radius: 4px;
      margin-top: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 시뮬레이션 화면 */
    .simulation-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* 모드 뱃지 (실제 vs 가상) */
    .mode-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      z-index: 20;
      transition: all 0.3s;
    }

    .mode-real { background: var(--real-mode); color: #000; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
    .mode-virtual { background: var(--virtual-mode); color: #fff; box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }

    .viewport {
      height: 280px;
      position: relative;
      background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%);
      overflow: hidden;
    }

    .observer {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 10;
    }
    .observer-icon { font-size: 28px; }

    /* 10pc 기준선 */
    .reference-line {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: dashed 2px var(--pc10-line);
      z-index: 1;
    }
    
    .reference-label {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      background: var(--pc10-line);
      color: #000;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.8rem;
      z-index: 2;
    }

    /* 유령 별 (절대등급 위치) */
    .star-ghost-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 3;
      opacity: 0.3;
      pointer-events: none;
    }
    .star-ghost-glow {
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--star-ghost) 30%, transparent 70%);
    }

    /* 움직이는 실제 별 */
    .star-wrapper {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 5;
    }
    .star-glow {
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--star-real) 20%, transparent 70%);
      transition: width 0.2s, height 0.2s;
    }
    .star-label {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.8);
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      border: 1px solid #475569;
    }

    /* 조작 및 정보 패널 */
    .controls-container {
      padding: 20px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-panel {
      display: flex;
      background: var(--card-bg);
      border-radius: 8px;
      border-left: 4px solid var(--accent);
      overflow: hidden;
    }
    @media (max-width: 600px) { .info-panel { flex-direction: column; } }

    .info-box {
      padding: 16px;
      text-align: center;
      flex: 1;
      border-right: 1px solid #334155;
    }
    .info-box:last-child { border-right: none; }

    .info-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .info-value { font-size: 1.25rem; font-weight: bold; color: #fff; }
    .fixed-badge { font-size: 0.7rem; background: #ef4444; padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

    /* 슬라이더 영역 */
    .slider-box {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .slider-header {
      display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold; font-size: 1.05rem;
    }
    input[type="range"] {
      width: 100%; accent-color: var(--accent); height: 8px; cursor: pointer;
    }
    .slider-labels {
      display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;
    }

    /* 결과 해설 박스 */
    .result-box {
      padding: 16px; border-radius: 8px; text-align: center; transition: all 0.3s;
    }
    .math-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
    .explanation { font-size: 1rem; color: #e2e8f0; line-height: 1.5; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>중3 과학: 유명한 별들의 위치와 밝기</h1>
    <div class="subtitle">실제 위치 확인 후 별을 직접 이동시켜보자!</div>
  </header>

  <!-- 별 선택 패널 -->
  <div class="preset-section">
    <div class="preset-group" id="presetGroup">
      <!-- 기존 3개 + 추가 5개 -->
      <button class="preset-btn" onclick="setStar('sun')">태양</button>
      <button class="preset-btn" onclick="setStar('proxima')">프록시마 센타우리</button>
      <button class="preset-btn" onclick="setStar('sirius')">시리우스</button>
      <button class="preset-btn" onclick="setStar('vega')">직녀성(베가)</button>
      <button class="preset-btn" onclick="setStar('aldebaran')">알데바란</button>
      <button class="preset-btn" onclick="setStar('polaris')">북극성</button>
      <button class="preset-btn" onclick="setStar('betelgeuse')">베텔게우스</button>
      <button class="preset-btn" onclick="setStar('rigel')">리겔</button>
      <button class="preset-btn custom-btn" id="btnCustom" onclick="toggleCustomMode()">🛠 사용자 설정</button>
    </div>

    <!-- 사용자 설정 모드일 때만 보이는 절대등급 입력기 -->
    <div class="custom-panel" id="customPanel">
      <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; color: #fff;">이 별의 진짜 밝기(절대 등급)를 직접 정해주세요:</div>
      <div style="display: flex; gap: 16px; align-items: center;">
        <input type="range" id="sliderCustomM" min="-10" max="15" step="0.1" value="0" style="flex: 1; accent-color: #8b5cf6;" oninput="updateCustomM()">
        <span id="customMValue" style="font-weight: bold; font-size: 1.1rem; color: #c4b5fd; width: 60px; text-align: right;">0.0</span>
      </div>
    </div>
  </div>

  <!-- 시뮬레이션 패널 -->
  <div class="simulation-panel">
    <div class="viewport">
      <div id="modeBadge" class="mode-badge mode-real">🔍 실제 관측 데이터</div>

      <div class="observer">
        <div class="observer-icon">🌍</div>
        <div>지구</div>
      </div>

      <!-- 10pc 고정 기준선 -->
      <div class="reference-line"></div>
      <div class="reference-label">10 pc (기준 거리)</div>

      <!-- 유령 별 (절대등급) -->
      <div class="star-ghost-wrapper">
        <div class="star-ghost-glow" id="ghostGlow"></div>
        <div style="margin-top: 4px; font-size: 0.7rem; color: #fff; white-space: nowrap;">10pc 위치 (절대등급)</div>
      </div>

      <!-- 실제/가상 이동 별 -->
      <div class="star-wrapper" id="starWrapper">
        <div class="star-glow" id="starGlow"></div>
        <div class="star-label" id="starLabel">현재 위치</div>
      </div>
    </div>

    <div class="controls-container">
      
      <div class="info-panel">
        <div class="info-box">
          <div class="info-title">별의 진짜 밝기 (절대 등급 M)</div>
          <div class="info-value" id="valM">0.0 <span class="fixed-badge">고정</span></div>
        </div>
        <div class="info-box">
          <div class="info-title">우리 눈에 보이는 밝기 (겉보기 등급 m)</div>
          <div class="info-value" id="valm" style="color: #fde047;">0.0</div>
        </div>
      </div>

      <div class="slider-box">
        <div class="slider-header">
          <span id="sliderTitleText">우주 공간에서 별의 거리를 이동시켜 보세요</span>
          <span id="valDist" style="color: var(--accent);">10 pc</span>
        </div>
        <!-- 거리 슬라이더: -2(0.01pc) ~ 3(1000pc) 로그 스케일 -->
        <input type="range" id="sliderDistance" min="-2" max="3" step="0.01" value="1">
        <div class="slider-labels">
          <span>0.01 pc (매우 가까움)</span>
          <span>10 pc (기준)</span>
          <span>1000 pc (매우 멂)</span>
        </div>
      </div>

      <div class="result-box" id="resultBox">
        <div class="math-text" id="mathText">m = M</div>
        <div class="explanation" id="expText">설명 텍스트</div>
      </div>
    </div>
  </div>
</div>

<script>
  const sliderDistance = document.getElementById('sliderDistance');
  const sliderCustomM = document.getElementById('sliderCustomM');
  const customPanel = document.getElementById('customPanel');
  const customMValue = document.getElementById('customMValue');
  const modeBadge = document.getElementById('modeBadge');
  
  const valM = document.getElementById('valM');
  const valm = document.getElementById('valm');
  const valDist = document.getElementById('valDist');
  const starWrapper = document.getElementById('starWrapper');
  const starGlow = document.getElementById('starGlow');
  const ghostGlow = document.getElementById('ghostGlow');
  const resultBox = document.getElementById('resultBox');
  const mathText = document.getElementById('mathText');
  const expText = document.getElementById('expText');

  // 실제 유명한 별 데이터 (M: 절대등급, d: 실제 거리 pc)
  const stars = {
    sun: { name: '태양', M: 4.8, d: 0.0000048 },
    proxima: { name: '프록시마 센타우리', M: 15.5, d: 1.3 }, // 가장 가까운 별이지만 엄청 어두움
    sirius: { name: '시리우스', M: 1.4, d: 2.6 },
    vega: { name: '직녀성(베가)', M: 0.6, d: 7.7 },
    aldebaran: { name: '알데바란', M: -0.6, d: 20 },
    polaris: { name: '북극성', M: -3.6, d: 133 },
    betelgeuse: { name: '베텔게우스', M: -5.8, d: 200 }, // 초거성
    rigel: { name: '리겔', M: -7.9, d: 260 } // 엄청나게 밝은 별
  };

  let isRealMode = true;
  let currentM = 0;
  let isCustom = false;

  // 버튼 스타일 초기화 함수
  function clearButtons() {
    document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
    customPanel.style.display = 'none';
    isCustom = false;
  }

  // 별 선택 함수 (처음엔 무조건 실제 데이터 로드)
  function setStar(starId) {
    clearButtons();
    const btn = document.querySelector(`button[onclick="setStar('${starId}')"]`);
    if(btn) btn.classList.add('active');
    
    currentM = stars[starId].M;
    let actualDist = stars[starId].d;
    
    // 시각적 한계 처리 (태양은 너무 가까워서 슬라이더 최소값에 고정)
    let sliderVal = Math.log10(actualDist);
    if (sliderVal < -2) sliderVal = -2;
    if (sliderVal > 3) sliderVal = 3;
    
    // 슬라이더 위치를 '실제 거리'에 맞춤
    sliderDistance.value = sliderVal;
    
    // 실제 모드 ON
    isRealMode = true;
    modeBadge.className = 'mode-badge mode-real';
    modeBadge.innerHTML = '🔍 실제 관측 데이터';
    
    updateSimulation();
  }

  // 사용자 설정 모드 켜기
  function toggleCustomMode() {
    clearButtons();
    document.getElementById('btnCustom').classList.add('active');
    customPanel.style.display = 'block';
    isCustom = true;
    
    updateCustomM();
    
    // 사용자 설정은 처음엔 10pc에 두기
    sliderDistance.value = 1;
    isRealMode = false;
    modeBadge.className = 'mode-badge mode-virtual';
    modeBadge.innerHTML = '✨ 가상 실험 모드';
    
    updateSimulation();
  }

  // 사용자 설정 M 슬라이더 움직일 때
  function updateCustomM() {
    currentM = parseFloat(sliderCustomM.value);
    customMValue.textContent = currentM.toFixed(1);
    updateSimulation();
  }

  // 사용자가 거리 슬라이더를 건드렸을 때 이벤트
  sliderDistance.addEventListener('input', () => {
    if (isRealMode) {
      isRealMode = false;
      modeBadge.className = 'mode-badge mode-virtual';
      modeBadge.innerHTML = '✨ 가상 이동 실험';
    }
    updateSimulation();
  });

  // 메인 연산 및 화면 업데이트 엔진
  function updateSimulation() {
    // 1. 절대등급 (M) UI 갱신 및 유령별 크기 세팅
    valM.innerHTML = `${currentM > 0 && currentM !== 0 ? '+' : ''}${currentM.toFixed(1)} <span class="fixed-badge">고정</span>`;
    
    let ghostSize = 70 - (currentM * 6);
    if (ghostSize < 8) ghostSize = 8;
    if (ghostSize > 150) ghostSize = 150;
    ghostGlow.style.width = `${ghostSize}px`;
    ghostGlow.style.height = `${ghostSize}px`;

    // 2. 현재 거리 계산 (로그 스케일 복원)
    const sliderVal = parseFloat(sliderDistance.value);
    // 태양의 경우 모드가 Real일때는 실제 거리 표시, 가상으로 움직이면 슬라이더 거리 표시
    let distance = Math.pow(10, sliderVal);
    
    if (isRealMode && !isCustom && distance < 0.02) { 
      // 태양 예외 처리 (0.01pc에 멈춰있지만 글자는 실제 값 출력)
      valDist.textContent = `0.0000048 pc`;
      distance = 0.0000048; 
    } else {
      valDist.textContent = `${distance < 0.1 ? distance.toFixed(2) : distance.toFixed(1)} pc`;
    }

    // 3. 겉보기 등급(m) 계산
    const m = currentM + 5 * Math.log10(distance) - 5;
    valm.textContent = `${m > 0 && m !== 0 ? '+' : ''}${m.toFixed(1)}`;

    // 4. 별의 화면상 위치 계산
    // x = -2 (10%), x = 1 (50%), x = 3 (90%) 로 위치 매핑
    let position = 50;
    if (sliderVal <= 1) {
      // -2 ~ 1 구간을 10% ~ 50% 에 매핑
      position = 10 + ((sliderVal + 2) / 3) * 40;
    } else {
      // 1 ~ 3 구간을 50% ~ 90% 에 매핑
      position = 50 + ((sliderVal - 1) / 2) * 40;
    }
    starWrapper.style.left = `${position}%`;

    // 5. 겉보기 등급에 따른 실제 별빛 크기
    let realSize = 70 - (m * 6);
    if (realSize < 5) realSize = 5;
    if (realSize > 250) realSize = 250;
    starGlow.style.width = `${realSize}px`;
    starGlow.style.height = `${realSize}px`;

    // 6. 하단 결과 해설 패널 판정
    const diff = m - currentM;
    
    if (Math.abs(diff) < 0.1) {
      resultBox.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
      resultBox.style.border = '2px solid #10b981';
      mathText.innerHTML = `겉보기 등급(m) <span style="color:#10b981;">=</span> 절대 등급(M)`;
      expText.innerHTML = `우리 눈에 보이는 밝기(m)와 진짜 밝기(M)가 같습니다.<br>별이 딱 <b>10pc 거리</b>에 위치해 있습니다.`;
    } else if (diff < 0) {
      resultBox.style.backgroundColor = 'rgba(59, 130, 246, 0.1)';
      resultBox.style.border = '2px solid #3b82f6';
      mathText.innerHTML = `겉보기 등급(m) <span style="color:#3b82f6;">&lt;</span> 절대 등급(M)`;
      expText.innerHTML = `진짜 밝기보다 <b>더 밝게(숫자가 작게)</b> 보입니다.<br>별이 <b>10pc보다 가까운 곳</b>에 위치해 있습니다.`;
    } else {
      resultBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
      resultBox.style.border = '2px solid #ef4444';
      mathText.innerHTML = `겉보기 등급(m) <span style="color:#ef4444;">&gt;</span> 절대 등급(M)`;
      expText.innerHTML = `진짜 밝기보다 <b>더 어둡게(숫자가 크게)</b> 보입니다.<br>별이 <b>10pc보다 먼 곳</b>에 위치해 있습니다.`;
    }
  }

  // 초기 시작: 베가(직녀성) 데이터로 시작
  setStar('vega');
</script>

</body>
</html>
